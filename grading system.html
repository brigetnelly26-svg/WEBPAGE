    <title>my grading system</title>

<body>
    <script>let mark=prompt("enter student mark");
        let grade;
        mark=Number(mark);//convert input to number
        if (mark>100 || mark<0){
            console.log("invalid input");
        } else if(mark>70 && mark <= 100){
            console.log("grade=A");

        }
        else if(mark>=60 && mark<=100){
            console.log("grade=B");
        }
        else if(mark>=50 && mark<=59){
            console.log("grade=C");
        } else if(mark>=40 && mark<=49){
            console.log("grade=D");
        } else {
           console.log ("grade=F");

        }
        console.log("mark");
        console.log("grade");
    </script>
